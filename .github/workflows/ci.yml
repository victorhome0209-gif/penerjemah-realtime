# Tes otomatis tanpa rahasia dan tanpa biaya. Tidak ada secrets, tidak ada deploy.
# Workflow ini hanya membaca repo (contents: read) dan tidak mempublikasikan apa pun.
name: tes
on:
  push:
    branches: [main, 'vocalbridge-v*', 'claude/**']
  pull_request:
    branches: [main, 'vocalbridge-v*']
permissions:
  contents: read
concurrency:
  group: tes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-statis:
    name: Backend, statis, dependensi, regresi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/static-check.js
      - run: cd backend && node --test test/*.test.js
      - run: node tests/dependency-check.js
      - run: cd backend && npm audit --omit=dev
      # Hanya pelaporan (anotasi terbaca lewat API). Gerbang audit adalah langkah npm audit di atas; langkah ini tidak menggantikannya.
      - if: always()
        run: cd backend && (npm audit --omit=dev --json > "$RUNNER_TEMP/audit-backend.json" 2>/dev/null || true) && node ../tests/audit-summary.js backend "$RUNNER_TEMP/audit-backend.json"
  e2e-chromium:
    name: Chromium end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Memasang persis sesuai package-lock.json; gagal bila lockfile tidak cocok dengan package.json.
      - run: npm ci --no-audit --no-fund
      - run: npm ls playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/run-all.js
      - run: npm audit --audit-level=high
      # Hanya pelaporan: jumlah kerentanan root/dev (semua tingkat) sebagai anotasi. Gerbang audit adalah dua langkah npm audit di atas.
      - if: always()
        run: (npm audit --json > "$RUNNER_TEMP/audit-root.json" 2>/dev/null || true) && node tests/audit-summary.js root "$RUNNER_TEMP/audit-root.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukti-validasi
          path: docs/bukti/ringkasan-validasi.txt
          if-no-files-found: ignore
